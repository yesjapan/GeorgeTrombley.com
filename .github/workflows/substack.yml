name: Mirror Substack

# Pulls any new posts from the Substack feed into src/content/posts/ and commits
# them. Cloudflare Pages builds on the resulting push, so publishing on Substack
# puts the post on georgetrombley.com without anyone touching the repo.
#
# Only new posts are written; existing files are never overwritten, so edits made
# here survive. Edits made on Substack after import do NOT flow through — re-run
# `npm run import-substack -- --force` by hand for that.
#
# Imported posts carry `sourceUrl` (credit link) but no `canonicalUrl`, so this
# site stays the copy search engines index. See scripts/import-substack.mjs.
#
# Same GITHUB_TOKEN note as the video workflow: pushes made with GITHUB_TOKEN do
# not trigger other GitHub Actions. That is fine because Cloudflare Pages deploys
# through its own git integration and sees this commit like any other. It would
# break under a GitHub Actions-based deploy.

on:
  schedule:
    # Four times a day, offset from the video job so the two never race.
    - cron: '43 */6 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-substack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import new posts
        run: npm run import-substack

      - name: Commit if anything new arrived
        run: |
          if git diff --quiet --exit-code -- src/content/posts && \
             [ -z "$(git ls-files --others --exclude-standard -- src/content/posts)" ]; then
            echo "No new Substack posts."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -m "Mirror new posts from Substack"
          git push
